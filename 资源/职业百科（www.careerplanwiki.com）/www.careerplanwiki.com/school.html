		<!-- 数据模版 -->
		<script id="template-data" type="text/html">
			<div class="row data-list">
				<% if (data.length == 0) {%>
					<div class="col-md-12 col-xs-12 data-empty">没有数据</div>
				<% }else { %>
					<% for (i in data) {%>
					<div class="col-md-6 col-sm-12 col-xs-12 data-item">
						<div class="item clearfix">
							<div class="img-box">
								<a href="{{data[i]._href}}">
									<% if (data[i].logo){ %>
									<img src="{{data[i].logo}}" class="img-circle"/>
									<% }else{ %>
									<img src="/assets/wiki/images/wiki_school_logo.jpg" class="img-circle"/>
									<% } %>
								</a>
							</div>
							<div class="info-box">
								<div class="title"><a href="{{data[i]._href}}">{{data[i].name}}</a></div>
								<p>隶属：{{data[i]._subjection}}</p>
								<p>
									<% if(data[i].is985){ %>
									<span>985</span>
									<% } %>
									<% if(data[i].is211){ %>
									<span>211</span>
									<% } %>
									<% if(data[i].isyan){ %>
									<span>研究生院</span>
									<% } %>
								</p>
							</div>
							<div class="collect-box">
								<div>
									<div class="box-content">
										<% if(data[i].is_collect){ %>
											<i class="glyphicon glyphicon-star"></i>
											<button class="btn btn-default cancel-collect-btn">已收藏</button>
										<% } else { %>
											<i class="glyphicon glyphicon-star-empty"></i>
											<button class="btn btn-default collect-btn">收藏</button>
										<% }%>
									</div>
								</div>
							</div>
						</div>
					</div>
					<% } %>
				<% } %>
			</div>
		</script>
		
		<!-- 城市筛选模版 -->
		<script id="template-area" type="text/html">
			<div class="r_cbox_insbox">

				</div> 
				<div class="scroll_box card-area-plug jspScrollable">
					<div class="jspContainer">
						<div class="jspPane">
							<div class="a_type clearfix">
								<% for (i in data){ %>
								<div>
									<div class="classes_box" data-value="{{data[i].id}}">
										<div class="a_cbox_wrap">
											<div class="a_cbox">
												<i class="cbox_icon"></i><span title="{{data[i].title}}" class="cbox_txt">{{data[i].title}}：</span>

									<div class="details_box clearfix">

												<i class="cbox_icon"></i><span class="cbox_txt" title="{{data[i].children[c].title}}">{{data[i].children[c].title}}</span>

										<% } %>

								</div>
								<% } %>
							</div>
						</div>
					</div>
				</div>

			<i class="left_line" style="top: 116px;"></i>

		<!-- 分页模版 -->
		<script id="template-page" type="text/html">
			<% if (data.pages.length > 1) {%>
			<nav aria-label="Page navigation">
			  <ul class="pagination">
			    
			    <li <% if(data.currentPage == 1) {%> class="disabled" <% }else{ %> class="pages" data-page="first" <% } %> >
			      <a href="javascript:;">
			        <span>首页</span>
			      </a>
			    </li>
			    <li <% if(data.currentPage == 1) {%> class="disabled" <% }else{ %> class="pages" data-page="prev" <% } %> >
			      <a href="javascript:;">
			        <span>上一页</span>
			      </a>
			    </li>
			    <% for (i in data.pages){ %>
			    	<% if (data.pages[i] == data.currentPage){ %>
			    	<li class="active"><a href="javascript:;">{{data.pages[i]}}</a></li>
			    	<% } else { %>
			    		<li class="pages hidden-xs" data-page="{{data.pages[i]}}"><a href="javascript:;">{{data.pages[i]}}</a></li>
			    	<% } %>
			    <% } %>
			    <li <% if(data.currentPage == data.totalPage) {%> class="disabled" <% }else{ %> class="pages" data-page="next" <% } %>>
			      <a href="javascript:;">
			        <span>下一页</span>
			      </a>
			    </li>
			    <li <% if(data.currentPage == data.totalPage) {%> class="disabled" <% }else{ %> class="pages" data-page="last" <% } %>>
			      <a href="javascript:;">
			        <span>末页</span>
			      </a>
			    </li>
			  </ul>
			</nav>
			<% } %>
		</script>
